<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Mariela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #8c8c8c;
    --line: #e9e9e9;
    --ph: #f2f2f2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: max(36px, env(safe-area-inset-top)) 20px 56px;
  }

  /* ---------- Encabezado ---------- */
  .name {
    font-size: .95rem;
    font-weight: 400;
    color: var(--muted);
    margin: 0 0 24px;
  }

  /* ---------- Cuenta atrás ---------- */
  .days {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0;
  }
  .days .num {
    font-weight: 300;
    font-size: clamp(5.5rem, 34vw, 9rem);
    line-height: .85;
    letter-spacing: -.05em;
    font-variant-numeric: tabular-nums;
  }
  .days .lbl { font-size: 1rem; color: var(--muted); }
  .hms {
    display: flex;
    gap: 18px;
    margin: 18px 0 0;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .hms span b { font-weight: 500; }
  .hms span i { font-style: normal; color: var(--muted); margin-left: 2px; }

  /* ---------- Progreso ---------- */
  .route { margin: 34px 0 36px; }
  .track { position: relative; height: 1px; background: var(--line); }
  .done  { position: absolute; left: 0; top: 0; height: 1px; width: 0; background: var(--ink); transition: width 1s; }
  .dot   {
    position: absolute; top: 50%; left: 0;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ink);
    transform: translate(-50%, -50%);
    transition: left 1s;
  }
  .route-labels {
    display: flex; justify-content: space-between;
    margin-top: 10px;
    font-size: .72rem; color: var(--muted);
    letter-spacing: .04em;
  }
  .route-labels .pct { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- Fotos ---------- */
  figure { margin: 0; }
  figure img, figure .ph {
    display: block; width: 100%; height: 100%;
    object-fit: cover;
    background: var(--ph);
  }
  figure .ph { display: grid; place-items: center; color: #c4c4c4; font-size: .75rem; letter-spacing: .1em; }
  figcaption { font-size: .72rem; color: var(--muted); margin-top: 6px; }
  .zoomable { cursor: zoom-in; }

  /* foto principal: de borde a borde */
  .hero { margin: 0 -20px 40px; aspect-ratio: 4 / 5; }
  .hero figcaption { padding: 0 20px; }

  /* variaciones que se van turnando entre párrafos */
  .f-right  { width: 68%; margin: 32px 0 32px auto; aspect-ratio: 3 / 4; }
  .f-left   { width: 60%; margin: 32px auto 32px 0; aspect-ratio: 1; }
  .f-wide   { margin: 36px -20px; aspect-ratio: 3 / 2; }
  .f-wide figcaption { padding: 0 20px; }
  .f-pair   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 32px 0; align-items: start; }
  .f-pair figure { aspect-ratio: 3 / 4; }
  .f-pair figure:last-child { margin-top: 48px; }

  /* ---------- Mensaje ---------- */
  .msg p {
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: 1.22rem;
    line-height: 1.6;
    margin: 0 0 18px;
  }
  .firma {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.15rem;
    text-align: right;
    margin: 28px 0 0;
  }

  /* ---------- Relojes ---------- */
  .clocks {
    display: grid; grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--line);
    margin-top: 48px; padding-top: 18px;
  }
  .clocks div { font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
  .clocks strong {
    display: block;
    font-weight: 400; font-size: 1.4rem;
    color: var(--ink);
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  /* ---------- Visor ---------- */
  .viewer {
    position: fixed; inset: 0;
    background: rgba(255,255,255,.97);
    display: none; place-items: center;
    padding: 16px; z-index: 10; cursor: zoom-out;
  }
  .viewer.open { display: grid; }
  .viewer img { max-width: 100%; max-height: 90vh; }
</style>
</head>
<body>
<main>
  <p class="name" id="name"></p>

  <div aria-live="polite">
    <p class="days"><span class="num" id="d">0</span><span class="lbl">días</span></p>
    <p class="hms">
      <span><b id="h">00</b><i>h</i></span>
      <span><b id="m">00</b><i>min</i></span>
      <span><b id="s">00</b><i>s</i></span>
    </p>
  </div>

  <div class="route">
    <div class="track"><div class="done" id="done"></div><div class="dot" id="dot"></div></div>
    <div class="route-labels"><span id="fIda"></span><span class="pct" id="pct">0%</span><span id="fVuelta"></span></div>
  </div>

  <div id="flow"></div>

  <div class="clocks">
    <div>San José<strong id="clockCR">--:--</strong></div>
    <div>Whitefish<strong id="clockMT">--:--</strong></div>
  </div>
</main>

<div class="viewer" id="viewer"><img id="viewerImg" alt=""></div>

<script src="config.js"></script>
<script>
  const C = window.CONFIG;
  const $ = id => document.getElementById(id);
  const salida = new Date(C.salida).getTime();
  const meta = new Date(C.reencuentro).getTime();
  $("name").textContent = C.arriba || C.para;
  document.title = C.para;
  const fecha = t => new Intl.DateTimeFormat("es-CR", { day: "numeric", month: "short", timeZone: "America/Costa_Rica" }).format(new Date(t)).replace(".", "");
  $("fIda").textContent = fecha(salida);
  $("fVuelta").textContent = fecha(meta);

  // ---------- Fotos y mensaje intercalados ----------
  function photo(ft, cls) {
    const fig = document.createElement("figure");
    if (cls) fig.className = cls;
    if (ft && ft.archivo) {
      const img = document.createElement("img");
      img.src = "fotos/" + ft.archivo; img.alt = ft.pie || ""; img.loading = "lazy";
      img.className = "zoomable";
      img.addEventListener("click", () => { $("viewerImg").src = img.src; $("viewer").classList.add("open"); });
      fig.appendChild(img);
    } else {
      const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "FOTO"; fig.appendChild(ph);
    }
    if (ft && ft.pie) { const c = document.createElement("figcaption"); c.textContent = ft.pie; fig.appendChild(c); }
    return fig;
  }

  const flow = $("flow");
  const fotos = C.fotos.slice();
  if (fotos.length) flow.appendChild(photo(fotos.shift(), "hero"));

  const msg = document.createElement("div"); msg.className = "msg"; flow.appendChild(msg);
  const layouts = ["f-wide", "f-pair", "f-right", "f-left"];
  let li = 0;
  function nextBlock() {
    const lay = layouts[li++ % layouts.length];
    if (lay === "f-pair") {
      if (fotos.length >= 2) {
        const wrap = document.createElement("div"); wrap.className = "f-pair";
        wrap.appendChild(photo(fotos.shift())); wrap.appendChild(photo(fotos.shift()));
        return wrap;
      }
      return photo(fotos.shift(), "f-right");
    }
    return photo(fotos.shift(), lay);
  }

  C.mensaje.forEach((t, i) => {
    const p = document.createElement("p"); p.textContent = t; msg.appendChild(p);
    if (i < C.mensaje.length - 1 && fotos.length) msg.appendChild(nextBlock());
  });
  while (fotos.length) msg.appendChild(nextBlock());   // las que sobren van al final
  const firma = document.createElement("p"); firma.className = "firma"; firma.textContent = C.firma; msg.appendChild(firma);

  $("viewer").addEventListener("click", () => $("viewer").classList.remove("open"));

  // ---------- Reloj ----------
  const fmt = tz => new Intl.DateTimeFormat("es-CR", { hour: "numeric", minute: "2-digit", timeZone: tz }).format(new Date());
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const now = Date.now();
    let diff = Math.max(0, meta - now);
    const d = Math.floor(diff / 864e5); diff -= d * 864e5;
    const h = Math.floor(diff / 36e5);  diff -= h * 36e5;
    const m = Math.floor(diff / 6e4);   diff -= m * 6e4;
    const s = Math.floor(diff / 1e3);
    $("d").textContent = d; $("h").textContent = pad(h); $("m").textContent = pad(m); $("s").textContent = pad(s);

    const p = Math.min(1, Math.max(0, (now - salida) / (meta - salida)));
    $("done").style.width = (p * 100) + "%";
    $("dot").style.left = (p * 100) + "%";
    $("pct").textContent = Math.floor(p * 100) + "%";

    $("clockCR").textContent = fmt("America/Costa_Rica");
    $("clockMT").textContent = fmt("America/Denver");
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
